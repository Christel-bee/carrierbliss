<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarrierBliss Dashboard Demo</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--grid:#e9ebef;--side:#f3f4f6;--act:#e5e7eb;--blue:#2f8ae8;--org:#f59e0b;--grn:#22c55e;--pur:#7c4dcf;--pink:#e5376f;--teal:#2fb8b5;--red:#e8602f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1117;--card:#161b24;--ink:#f1f5f9;--mute:#94a3b8;--line:#263041;--grid:#222b3a;--side:#12161e;--act:#222b3a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:8px;align-items:center;padding:6px 8px 14px;font-weight:600}.brand i{width:26px;height:18px;border-radius:4px;background:linear-gradient(90deg,#e11d48,#111)}
nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);cursor:pointer;position:relative;transition:.25s;opacity:0;transform:translateX(-14px);animation:in .5s forwards}
nav a::before{content:"";width:14px;height:14px;border:1.6px solid var(--mute);border-radius:4px;transition:.25s}
nav a:hover{background:var(--act);transform:translateX(3px)}nav a:hover::before{border-color:var(--blue);transform:rotate(90deg)}
nav a.on{background:var(--act);font-weight:600}
.user{margin-top:auto;padding:10px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line)}.user b{width:26px;height:26px;border-radius:50%;background:var(--act);display:grid;place-items:center;font-size:12px}
main{padding:20px 24px 80px;min-width:0}
header{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:16px}
h1{margin:0;font-size:20px}header p{margin:2px 0 0;color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;transition:.2s}
.chip:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.08)}.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;
 opacity:0;transform:translateY(24px) scale(.97);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1),box-shadow .25s,border-color .25s}
.card.show{opacity:1;transform:none}.card.show:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.10);border-color:var(--blue)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(120,160,255,.14) 50%,transparent 60%);transform:translateX(-120%)}
.card.show::after{animation:shine 1.4s .3s}
.lab{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.ico{width:16px;height:16px;border-radius:5px;border:1.6px solid currentColor;animation:bob 3s ease-in-out infinite}
.val{font-size:24px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}.sub{color:var(--mute);font-size:12px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:6px;animation:ping 1.6s infinite}
h3{margin:0 0 10px;font-size:14px;font-weight:600}h2{margin:26px 0 12px;font-size:17px}
.hbar{display:grid;grid-template-columns:92px 1fr;gap:8px 8px;align-items:center;font-size:11px;color:var(--mute)}
.hbar .nm{text-align:right;line-height:1.1}
.track{position:relative;height:100%;min-height:20px;border-left:1px solid var(--mute);background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--grid) calc(25% - 1px) 25%)}
.bar{position:absolute;left:0;top:50%;height:19px;margin-top:-9.5px;border-radius:0 5px 5px 0;width:0;transition:width 1.3s cubic-bezier(.22,1,.36,1);cursor:pointer}
.bar:hover{filter:brightness(1.12);transform:scaleY(1.25)}
.bar::after{content:attr(data-v);position:absolute;left:100%;top:50%;transform:translate(6px,-50%);font-size:11px;color:var(--ink);opacity:0;transition:opacity .4s 1.1s;white-space:nowrap}
.show .bar::after{opacity:1}
.bar.in::after{left:auto;right:0;transform:translate(-8px,-50%);color:#fff;font-weight:600}
.axis{display:flex;justify-content:space-between;grid-column:2;font-size:11px;color:var(--mute);border-top:1px solid var(--mute);padding-top:4px;margin-top:4px}
.vchart{display:flex;align-items:flex-end;justify-content:space-around;height:210px;border-bottom:1px solid var(--mute);border-left:1px solid var(--mute);position:relative;margin-left:44px;background:repeating-linear-gradient(0deg,transparent 0 calc(25% - 1px),var(--grid) calc(25% - 1px) 25%)}
.vcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1;position:relative;cursor:pointer}
.vb{width:34px;height:0;border-radius:5px 5px 0 0;transition:height 1.3s cubic-bezier(.22,1,.36,1),filter .2s}
.vcol:hover .vb{filter:brightness(1.15)}.vcol:hover{background:rgba(120,130,150,.12)}
.vcol .x{position:absolute;bottom:-22px;font-size:11px;color:var(--mute)}
.yl{position:absolute;left:-44px;top:0;height:100%;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--mute);text-align:right;width:38px}
.tip{position:fixed;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transition:opacity .15s;z-index:9}
.donutwrap{display:grid;place-items:center;height:240px;position:relative}
svg circle.seg{fill:none;stroke-width:26;transition:stroke-dasharray 1.4s cubic-bezier(.22,1,.36,1);transform:rotate(-90deg);transform-origin:center;cursor:pointer}
svg circle.seg:hover{stroke-width:32}
.dl{position:absolute;font-size:11px}
.fab{position:fixed;right:18px;bottom:18px;width:48px;height:48px;border-radius:50%;background:#1d63ed;display:grid;place-items:center;color:#fff;cursor:pointer;animation:fab 2.4s infinite;z-index:8}
@keyframes in{to{opacity:1;transform:none}}@keyframes shine{to{transform:translateX(120%)}}
@keyframes bob{50%{transform:translateY(-2px) rotate(8deg)}}@keyframes ping{70%{box-shadow:0 0 0 8px rgba(47,138,232,0)}0%{box-shadow:0 0 0 0 rgba(47,138,232,.6)}}
@keyframes fab{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(29,99,237,.5)}50%{transform:scale(1.07);box-shadow:0 0 0 12px rgba(29,99,237,0)}}
html.embed .app{min-height:0}html.embed aside{position:static;height:auto}html.embed .fab{position:absolute;right:14px;bottom:14px}html.embed body{background:var(--bg)}
@media(max-width:1000px){.app{grid-template-columns:1fr}aside{display:none}.g4,.g3,.g21{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:560px){.g4,.g3,.g21{grid-template-columns:1fr}main{padding:14px 16px 80px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card,nav a{opacity:1;transform:none}}
</style></head><body>
<div class="app">
<aside><div class="brand"><i></i>SSR Logistics</div>
<nav id="nav"></nav>
<div class="user"><b>M</b>Mark Cappelletti</div></aside>
<main>
<header><div><h1>Dashboard</h1><p>Your operational overview at a glance.</p></div>
<div class="chips" id="chips"></div></header>
<div class="grid g4" id="k1"></div>
<div class="grid g3" id="k2" style="margin-top:14px"></div>
<div class="grid g21" style="margin-top:14px">
 <div class="card"><h3>Revenue by Load Type</h3><div class="vchart" id="rev"></div><div style="height:26px"></div></div>
 <div class="card"><h3>Revenue Distribution</h3><div class="donutwrap" id="donut"></div></div>
</div>
<div class="card" style="margin-top:14px"><h3>Average Rate Per Mile by Load Type</h3><div class="vchart" id="rate" style="height:170px"></div><div style="height:26px"></div></div>
<h2>Driver Performance</h2>
<div class="grid g2">
 <div class="card"><h3>Revenue by Driver</h3><div class="hbar" id="h1"></div></div>
 <div class="card"><h3>Loads by Driver</h3><div class="hbar" id="h2"></div></div>
</div>
<div class="card" style="margin-top:14px"><h3>Driver Efficiency — Avg Rate Per Mile</h3><div class="hbar" id="h3"></div></div>
<div class="card" style="margin-top:14px"><h3>Total Miles by Driver</h3><div class="hbar" id="h4"></div></div>
</main></div>
<div class="fab" title="Chat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4z"/></svg></div>
<div class="tip" id="tip"></div>
<script>
const $=s=>document.querySelector(s),C={pw:'var(--pur)',dv:'var(--grn)',fb:'var(--org)',rf:'var(--blue)'};
const D=['var(--blue)','var(--org)','var(--grn)','var(--pur)','var(--pink)','var(--teal)','var(--red)'];
const fmt=(n,d=0)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
// nav + chips
['Dashboard','Loads','Drivers','Team','Billing','Settlements','Taxes','Subscription','My Account','Archive','Settings'].forEach((t,i)=>{const a=document.createElement('a');a.textContent=t;if(!i)a.className='on';a.style.animationDelay=(.1+i*.06)+'s';a.onclick=()=>{document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));a.classList.add('on')};$('#nav').append(a)});
['All Drivers ▾','All Load Types ▾','Last 7 days','Last 30 days','This Month','From: Sep 28','To: Oct 28'].forEach((t,i)=>{const c=document.createElement('div');c.className='chip'+(i==4?' on':'');c.textContent=t;c.onclick=()=>{if(i>1){document.querySelectorAll('.chip').forEach((x,j)=>{if(j>1&&j<5)x.classList.remove('on')});if(i<5)c.classList.add('on');replay()}};$('#chips').append(c)});
// KPI cards
const K1=[['Active Loads',6,0],['Drivers',15,0],['Revenue',188295.19,2,'$'],['Avg Rate/Mile',2.99,2,'$']];
const K2=[['Dispatched',0,0,'',' $0.00'],['In Transit',6,0,'','$15,512.64',1],['Delivered',74,0,'','$174,567.95']];
const K3=[['Deadhead Miles',7596,0,'','12.1% of total'],['Loaded Miles',55317,0,'','87.9% of total'],['Total Miles',62913,0,'','100.0% of total']];
function kpi(el,arr){arr.forEach(([l,v,d,p,s,live],i)=>{const c=document.createElement('div');c.className='card';c.style.transitionDelay=i*90+'ms';
 c.innerHTML=`<div class="lab">${l}<span class="ico"></span></div><div class="val" data-n="${v}" data-d="${d}" data-p="${p||''}">0</div>${s?`<div class="sub">${live?'<span class="live"></span>':''}${s}</div>`:''}`;el.append(c)})}
kpi($('#k1'),K1);kpi($('#k2'),K2);
const k3=document.createElement('div');k3.className='grid g3';k3.style.marginTop='14px';$('#k2').after(k3);kpi(k3,K3);
// vertical charts
function vchart(el,items,max,ylab){el.innerHTML=`<div class="yl">${ylab.map(y=>`<span>${y}</span>`).join('')}</div>`+items.map(([n,v,c,t])=>`<div class="vcol" data-tip="${n}<br>${t}"><div class="vb" data-h="${v/max*100}" style="background:${c}"></div><span class="x">${n}</span></div>`).join('')}
vchart($('#rev'),[['Power Only',75,C.pw,'Revenue : $75k'],['Dry Van',12,C.dv,'Revenue : $12k'],['Flatbed',98,C.fb,'Revenue : $98k'],['Reefer',3,C.rf,'Revenue : $3k']],100,['$100k','$75k','$50k','$25k','$0k']);
vchart($('#rate'),[['Power Only',2.75,C.pw,'Avg $/Mile : $2.75'],['Dry Van',3.01,C.dv,'Avg $/Mile : $3.01'],['Flatbed',3.3,C.fb,'Avg $/Mile : $3.30'],['Reefer',2.55,C.rf,'Avg $/Mile : $2.55']],3.4,['$3.40','$2.55','$1.70','$0.85','$0.00']);
// donut
(function(){const R=80,L=2*Math.PI*R,seg=[['Power Only',40,C.pw],['Dry Van',7,C.dv],['Flatbed',52,C.fb],['Reefer',1,C.rf]];let off=0;
 let h=`<svg width="240" height="240" viewBox="0 0 240 240">`;seg.forEach(([n,p,c])=>{h+=`<circle class="seg" cx="120" cy="120" r="${R}" stroke="${c}" data-len="${p/100*L}" data-total="${L}" stroke-dasharray="0 ${L}" stroke-dashoffset="${-off/100*L}" data-tip="${n}<br>${p}% of revenue"/>`;off+=p});
 $('#donut').innerHTML=h+'</svg>'+`<span class="dl" style="top:34px;right:6%;color:var(--pur)">Power Only 40%</span><span class="dl" style="top:70px;left:2%;color:var(--grn)">Dry Van 7%</span><span class="dl" style="bottom:22px;left:14%;color:var(--org)">Flatbed 52%</span><span class="dl" style="top:48%;right:0;color:var(--blue)">Reefer 1%</span>`})();
// horizontal charts
function hchart(el,rows,max,ticks,lab,fmtv){el.innerHTML=rows.map(([n,v],i)=>`<div class="nm">${n}</div><div class="track"><div class="bar" style="background:${D[ ['Jose Diaz','Todd Watson','Jorge Soto Marce','Charlie Boyd','Glenn Gulledge','Jacob Cespedes','John Atwell'].indexOf(n)]};transition-delay:${i*110}ms" data-w="${v/max*100}" data-v="${fmtv(v)}" data-tip="${n}<br>${lab} : ${fmtv(v)}"></div></div>`).join('')+`<div class="axis">${ticks.map(t=>`<span>${t}</span>`).join('')}</div>`}
hchart($('#h1'),[['Jose Diaz',38e3],['Todd Watson',31e3],['Jorge Soto Marce',29.5e3],['Charlie Boyd',29e3],['Glenn Gulledge',19e3],['Jacob Cespedes',17.5e3],['John Atwell',14e3]],38e3,['$0k','$10k','$19k','$29k','$38k'],'Revenue',v=>'$'+fmt(v/1000,1)+'k');
hchart($('#h2'),[['Jose Diaz',10],['Todd Watson',7],['Jorge Soto Marce',19],['Charlie Boyd',10],['Glenn Gulledge',9],['Jacob Cespedes',14],['John Atwell',10]],20,[0,5,10,15,20],'Loads',v=>v);
hchart($('#h3'),[['Jose Diaz',3.38],['Todd Watson',3.32],['Charlie Boyd',3.1],['Glenn Gulledge',2.98],['Jorge Soto Marce',2.94],['Jacob Cespedes',2.8],['John Atwell',2.7]],3.4,['$0.00','$0.85','$1.70','$2.55','$3.40'],'Avg $/Mile',v=>'$'+v.toFixed(2));
hchart($('#h4'),[['Jose Diaz',11500],['Jorge Soto Marce',10600],['Todd Watson',9700],['Charlie Boyd',9500],['Jacob Cespedes',7550],['Glenn Gulledge',7150],['John Atwell',7050]],12000,['0','3,000','6,000','9,000','12,000'],'Miles',v=>fmt(v));
// animation engine
function count(el){const n=+el.dataset.n,d=+el.dataset.d,p=el.dataset.p,t0=performance.now(),dur=1500;
 (function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,4);el.textContent=p+fmt(n*e,d);if(k<1)requestAnimationFrame(f)})(t0)}
function run(card){card.classList.add('show');
 card.querySelectorAll('.val').forEach(count);
 card.querySelectorAll('.vb').forEach((b,i)=>setTimeout(()=>b.style.height=b.dataset.h+'%',200+i*150));
 card.querySelectorAll('.bar').forEach(b=>{b.style.width=b.dataset.w+'%';b.classList.toggle('in',+b.dataset.w>90)});
 card.querySelectorAll('.seg').forEach((s,i)=>setTimeout(()=>s.setAttribute('stroke-dasharray',`${s.dataset.len} ${s.dataset.total}`),200+i*250))}
function reset(card){card.classList.remove('show');
 card.querySelectorAll('.vb').forEach(b=>b.style.height='0');card.querySelectorAll('.bar').forEach(b=>b.style.width='0');
 card.querySelectorAll('.seg').forEach(s=>s.setAttribute('stroke-dasharray',`0 ${s.dataset.total}`))}
const embed=/embed/.test(location.search);
const cards=document.querySelectorAll('.card');
if(embed){document.documentElement.classList.add('embed');document.documentElement.dataset.theme='light'}
if(!embed){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)run(e.target);else if(e.boundingClientRect.top>0)reset(e.target)}),{threshold:.25});cards.forEach(c=>io.observe(c))}
else{
 // parent page tells us which slice of this (full-height) frame is on screen
 let v=null;
 function apply(){if(!v)return;cards.forEach(c=>{const r=c.getBoundingClientRect(),vis=r.top<v.top+v.h*.88&&r.bottom>v.top+20;
  if(vis&&!c.classList.contains('show'))run(c);else if(r.top>v.top+v.h+40&&c.classList.contains('show'))reset(c)})}
 addEventListener('message',e=>{if(e.data&&e.data.cbView){v=e.data.cbView;apply()}});
 const post=()=>parent.postMessage({cbHeight:document.documentElement.scrollHeight},'*');
 new ResizeObserver(post).observe(document.body);addEventListener('load',()=>{post();parent.postMessage({cbReady:1},'*')});
}
function replay(){cards.forEach(reset);setTimeout(()=>cards.forEach(c=>{const r=c.getBoundingClientRect();if(r.top<innerHeight)run(c)}),120)}
// tooltips
const tip=$('#tip');document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(t){tip.innerHTML=t.dataset.tip;tip.style.opacity=1;tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+14+'px'}else tip.style.opacity=0});
// live ticking: Delivered/In Transit gentle revenue "heartbeat"
</script></body></html>
